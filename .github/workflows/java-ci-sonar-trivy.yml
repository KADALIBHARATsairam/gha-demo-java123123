name: CI Java 18 App using SonarQube

on:
  push:
    branches:
      - main

# Global environment setting to acknowledge the Node version transition if needed
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: self-hosted

    steps:
      # 1. Checkout source code
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java 18 (Migrated to v5 to fix deprecation warnings)
      - name: Set up JDK 18
        uses: actions/setup-java@v5
        with:
          java-version: '18'
          distribution: 'temurin'
          cache: maven

      # 3. Setup Apache Maven using the official GitHub Action
      - name: Set up Apache Maven
        uses: stefanzweifel/setup-maven@v1
        with:
          maven-version: '3.9.9'

      # 4. Verify Java and Maven versions
      - name: Check Java and Maven Versions
        run: |
          java -version
          mvn -version

      # 5. Build + SonarQube Analysis
      - name: Build and SonarQube Analysis
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Boardgame \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      # 6. Build Docker Image
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kadalibharatsairam01/java-gha:latest

      # 7. Scan Docker image with trivy
      - name: Scan Docker image with trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: kadalibharatsairam01/java-gha:latest
          severity: CRITICAL,HIGH
          exit-code: 0
