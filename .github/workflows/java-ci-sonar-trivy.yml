name: CI Java 18 App using SonarQube

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual pipeline triggering from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest # Switched from self-hosted to GitHub-hosted runner

    steps:
      # 1. Checkout source code
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java 18 (GitHub runners download this dynamically)
      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          java-version: '18'
          distribution: 'temurin'
          cache: maven

      # 3. Verify Java and Maven versions
      # Note: Maven is pre-installed on ubuntu-latest, so this will work out-of-the-box
      - name: Check Java and Maven Versions
        run: |
          java -version
          mvn -version

      # 4. Build + SonarQube Analysis
      # Ensure your SONAR_HOST_URL and SONAR_TOKEN secrets are set in your GitHub Repository settings
      - name: Build and SonarQube Analysis
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Boardgame \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      # 5. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Build Docker Image & Export to Host
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true # Exports image to the runner's local Docker daemon so Trivy can see it
          tags: kadalibharatsairam01/java-gha:latest

      # 7. Scan Docker image with trivy
      - name: Scan Docker image with trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: kadalibharatsairam01/java-gha:latest
          severity: CRITICAL,HIGH
          exit-code: 0 
