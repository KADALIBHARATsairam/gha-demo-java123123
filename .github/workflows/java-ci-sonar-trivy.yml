name: CI/CD Java 18 & Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # Required to push the updated deployment-service.yaml back to the repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java 18
      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          java-version: '18'
          distribution: 'temurin'
          cache: maven

      # 3. Build Application
      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Build and Push Docker Image
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            kadalibharatsairam01/java-gha:latest
            kadalibharatsairam01/java-gha:${{ github.sha }}

      # 7. Update deployment-service.yaml with new Image Tag
      - name: Update Deployment YAML
        run: |
          echo "Updating image tag to: ${{ github.sha }}"
          
          # TARGETS THE CORRECT FILENAME FROM YOUR REPOSITORY
          yq -i '.spec.template.spec.containers[0].image = "kadalibharatsairam01/java-gha:${{ github.sha }}"' deployment-service.yaml
          
          # Verify the change in logs
          cat deployment-service.yaml | grep "image:"

      # 8. Commit and Push Changes back to GitHub
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          if [[ -n $(git status -s) ]]; then
            git add deployment-service.yaml
            git commit -m "Update deployment image to ${{ github.sha }} [skip ci]"
            git push origin main
          else
            echo "No changes discovered in deployment-service.yaml"
          fi
